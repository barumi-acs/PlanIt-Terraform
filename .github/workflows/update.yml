name: 2. Terraform Update (Auto on Push)

on:
  push:
    branches: [ "develop" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Node.js 24 강제 사용 설정 (경고 해결)

jobs:
  update-infra:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. AWS Setup
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: 3. Terraform Setup
        uses: hashicorp/setup-terraform@v3

      - name: 4. Check S3 Bucket Exists
        id: check_bucket
        run: |
          BUCKET_NAME="planit-team-tfstate-bucket"
          REGION="ap-northeast-2"
          if aws s3api head-bucket --bucket "$BUCKET_NAME" --region "$REGION" 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ S3 금고 확인 완료."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "❌ S3 금고 없음. 최초 생성이 필요합니다."
          fi

      - name: 5. Bootstrap (if needed)
        if: steps.check_bucket.outputs.exists == 'false'
        run: |
          terraform -chdir=terraform/bootstrap init
          terraform -chdir=terraform/bootstrap apply -auto-approve
      
      - name: 6. Setup SSH Key for Bastion
        run: |
          echo "${{ secrets.BASTION_SSH_KEY }}" > bastion_key.pem
          chmod 400 bastion_key.pem
          cp bastion_key.pem terraform/main/${{ secrets.PROJECT_NAME || 'planit' }}-key.pem

      - name: 7. Main Init & Apply
        env:
          AWS_MAX_ATTEMPTS: 10 # AWS CLI/SDK 재시도 횟수 상향
          AWS_RETRY_MODE: adaptive # 점진적 대기 시간을 사용하는 재시도 모드
          TF_VAR_aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_cognito_client_secret: ${{ secrets.COGNITO_CLIENT_SECRET }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_gnews_api_key: ${{ secrets.GNEWS_API_KEY }}

          TF_VAR_cognito_user_pool_id: ${{ secrets.COGNITO_USER_POOL_ID }}
          TF_VAR_cognito_client_id: ${{ secrets.COGNITO_CLIENT_ID }}
          
          TF_VAR_acm_certificate_arn_virginia: ${{ secrets.ACM_CERT_ARN_VIRGINIA }}
          TF_VAR_acm_certificate_arn_seoul: ${{ secrets.ACM_CERT_ARN_SEOUL }}
          
          TF_VAR_admin_cidr: ${{ secrets.ADMIN_CIDR || '0.0.0.0/0' }}
          TF_VAR_frontend_bucket_name: ${{ secrets.S3_BUCKET_FE }}
          
          # Slack Webhook URLs (하이브리드 알림 방식)
          TF_VAR_slack_webhook_critical: ${{ secrets.SLACK_WEBHOOK_CRITICAL }}
          TF_VAR_slack_webhook_user: ${{ secrets.SLACK_WEBHOOK_USER }}
          TF_VAR_slack_webhook_schedule: ${{ secrets.SLACK_WEBHOOK_SCHEDULE }}
          TF_VAR_slack_webhook_strategy: ${{ secrets.SLACK_WEBHOOK_STRATEGY }}
          TF_VAR_slack_webhook_insight: ${{ secrets.SLACK_WEBHOOK_INSIGHT }}
          TF_VAR_slack_webhook_insightai: ${{ secrets.SLACK_WEBHOOK_INSIGHTAI }}
        run: |
          terraform -chdir=terraform/main init
          terraform -chdir=terraform/main apply -auto-approve -input=false
