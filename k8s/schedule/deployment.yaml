apiVersion: apps/v1
kind: Deployment
metadata:
  name: planit-schedule-deploy
  namespace: planit-dev
  labels:
    app: schedule
    tier: backend
    env: dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: schedule

  template:
    metadata:
      labels:
        app: schedule
        tier: backend
        env: dev

    spec:
      containers:
        - name: schedule
          image: 746491138596.dkr.ecr.ap-northeast-2.amazonaws.com/planit-schedule:v2.0

          ports:
            - containerPort: 8082
            - containerPort: 9092

          envFrom:
            - configMapRef:
                name: planit-schedule-config
            - secretRef:
                name: planit-schedule-secret

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          volumeMounts:
            - name: logs-volume
              mountPath: /app/logs

          startupProbe:
            httpGet:
              path: /api/v1/base/actuator/health
              port: 8082
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 2

          readinessProbe:
            httpGet:
              path: /api/v1/base/actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 5

          livenessProbe:
            httpGet:
              path: /api/v1/base/actuator/health
              port: 8082
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 5

      volumes:
        - name: logs-volume
          emptyDir: {}