apiVersion: apps/v1
kind: Deployment
metadata:
  name: planit-insightai-deploy
  namespace: planit-dev
  labels:
    app: insightai
    tier: backend
    env: dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: insightai

  template:
    metadata:
      labels:
        app: insightai
        tier: backend
        env: dev

    spec:
      containers:
        - name: insightai
          image: 746491138596.dkr.ecr.ap-northeast-2.amazonaws.com/planit-insight-ai:v1.0

          ports:
            - containerPort: 8085
            - containerPort: 9095

          envFrom:
            - configMapRef:
                name: planit-insightai-config
            - secretRef:
                name: planit-insightai-secret

          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 15