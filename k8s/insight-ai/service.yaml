apiVersion: v1
kind: Service
metadata:
  name: planit-insightai-svc
  namespace: planit-dev
  labels:
    app: insightai

spec:
  type: ClusterIP

  selector:
    app: insightai

  ports:
    - name: http
      port: 8085
      targetPort: 8085

    - name: grpc
      port: 9095
      targetPort: 9095